name: Scheduled image vulnerability scan

# Re-scans the published images daily so newly-disclosed CVEs surface (and the justification
# reports regenerate) even when no new release was built. Advisory only — this workflow never
# gates anything. Findings land in Security -> Code scanning; SBOM + per-image justification
# reports are uploaded as workflow artifacts.
#
# Tag selection differs from upstream arthur-engine because this fork's default branch is
# `main`, not `dev`. Upstream runs on `dev`, where set-version appends `-dev` and the scan
# therefore targets the latest dev build. Here set-version leaves VERSION bare (e.g. 2.1.732)
# and no such plain tag is published — upstream only pushes plain tags from its own `main`,
# which lags. So the upstream images are scanned at `<version>-dev`, which is the build this
# fork's code actually corresponds to. Override with the `tag` input to scan a specific tag
# (e.g. a production release `2.1.656`).
#
# The migration image this repo publishes itself (build-shield-migration-gpu.yml) is pinned to
# `latest` instead: its version tags only exist once that workflow has run for a given version.

on:
  schedule:
    # Daily at 09:00 UTC
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for the upstream arthurplatform images (default: <version>-dev)"
        type: string
        required: false
        default: ""

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  scan:
    environment: shared-protected-branch-secrets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: arthurplatform/genai-engine-cpu, slug: genai-cpu }
          - { image: arthurplatform/genai-engine-gpu, slug: genai-gpu }
          - { image: arthurplatform/ml-engine, slug: ml-engine }
          - { image: arthurplatform/genai-engine-models-s3, slug: models-s3 }
          - { image: arthurplatform/genai-engine-models-fs, slug: models-fs }
          - { image: arthurplatform/genai-engine-models-gcs, slug: models-gcs }
          # Published by this repo, not upstream — pinned tag, see header note.
          - {
              image: arthurplatform/genai-engine-shield-migration-gpu,
              slug: shield-migration-gpu,
              tag: latest,
            }
    steps:
      # The model images are ~7GB and the GPU images ~10GB. A stock runner does not have
      # room to both pull and export them, which previously failed every large image in
      # this matrix with "no space left on device". Reclaim first (same action the release
      # build uses) so Trivy has working room.
      - uses: mathio/gha-cleanup@v1
        with:
          remove-browsers: true
          verbose: true
      - uses: actions/checkout@v5
      - uses: ./.github/workflows/composite-actions/set-version
      - name: Resolve image tag
        id: tag
        shell: bash
        env:
          OVERRIDE: ${{ github.event.inputs.tag }}
          PINNED: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          # Precedence: per-image pinned tag > manual override > <version>-dev.
          # set-version already appends `-dev` when the ref is not `main`, so strip it before
          # re-appending — otherwise a manual dispatch from a branch asks for `X-dev-dev`.
          BASE="${VERSION%-dev}"
          if [ -n "${PINNED}" ]; then
            TAG="${PINNED}"
          else
            TAG="${OVERRIDE:-${BASE}-dev}"
          fi
          echo "Scanning tag: ${TAG}"
          echo "value=${TAG}" >> "$GITHUB_OUTPUT"
      - name: Scan image & generate justification docs
        uses: ./.github/workflows/composite-actions/vuln-report
        with:
          image: ${{ matrix.image }}:${{ steps.tag.outputs.value }}
          slug: ${{ matrix.slug }}
          dockerhub-username: ${{ secrets.DOCKERHUB_ENTERPRISE_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_ENTERPRISE_TOKEN }}
