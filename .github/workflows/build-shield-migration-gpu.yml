name: Build & push shield-migration GPU image

# Publishes this fork's GenAI Engine GPU image to a migration-scoped Docker Hub repo:
#   arthurplatform/genai-engine-shield-migration-gpu
#
# Deliberately a separate repo from the official `arthurplatform/genai-engine-gpu` so
# migration builds never clobber released images. The main CI workflow
# (arthur-engine-workflow.yml) only builds images on 'Increment arthur-engine version'
# commits, which are produced by version-workflow.yml on the `dev` branch — a branch this
# fork does not have. So that job never fires here; this workflow is the one that does.
#
# Tags pushed: <version from ./version> and `latest`.
# The image is scanned with Trivy afterwards (advisory) — see composite-actions/vuln-report.

on:
  push:
    branches:
      - main
    paths:
      - "genai-engine/**"
      - "version"
      - ".github/workflows/build-shield-migration-gpu.yml"
      - ".github/workflows/composite-actions/vuln-report/**"
  workflow_dispatch:
    inputs:
      push_latest:
        description: "Also move the `latest` tag to this build"
        type: boolean
        required: false
        default: true

# Only one GPU build at a time; a newer push supersedes an in-flight build.
concurrency:
  group: shield-migration-gpu
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  build-and-push:
    environment: shared-protected-branch-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # Fail fast with an actionable message. This fork was created without Docker Hub
      # credentials, so every merge to main burned ~2 minutes of disk cleanup and then died
      # inside docker/login-action with the opaque "Username and password required" — the
      # image was silently never published. Name the missing secrets instead.
      - name: Preflight — required secrets
        shell: bash
        env:
          DOCKERHUB_OSS_USERNAME: ${{ secrets.DOCKERHUB_OSS_USERNAME }}
          DOCKERHUB_OSS_TOKEN: ${{ secrets.DOCKERHUB_OSS_TOKEN }}
          GITLAB_UNIFY_FRONTEND_TOKEN: ${{ secrets.GITLAB_UNIFY_FRONTEND_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          for s in DOCKERHUB_OSS_USERNAME DOCKERHUB_OSS_TOKEN GITLAB_UNIFY_FRONTEND_TOKEN; do
            [ -n "${!s:-}" ] || missing+=("$s")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            {
              echo "### Cannot publish the shield-migration GPU image"
              echo
              echo "Missing required secrets:"
              printf -- '- `%s`\n' "${missing[@]}"
              echo
              echo "Add them to this repository's **shared-protected-branch-secrets**"
              echo "environment (Settings → Environments), then re-run. \`DOCKERHUB_OSS_*\` must"
              echo "be able to push to \`arthurplatform/genai-engine-shield-migration-gpu\`;"
              echo "\`GITLAB_UNIFY_FRONTEND_TOKEN\` is required for the private \`@arthur/*\`"
              echo "packages in the UI build stage."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Missing required secrets: ${missing[*]} — add them to the shared-protected-branch-secrets environment (Settings → Environments). See the job summary."
            exit 1
          fi
          # Stray whitespace from a copy-paste is an unambiguous error and Docker Hub reports it
          # only as "incorrect username or password". Compare each value against its trimmed form;
          # never echo the values themselves.
          for s in DOCKERHUB_OSS_USERNAME DOCKERHUB_OSS_TOKEN; do
            v="${!s}"
            if [ "$v" != "$(printf '%s' "$v" | tr -d '[:space:]')" ]; then
              echo "::error::\`${s}\` contains whitespace (leading, trailing, or a newline from the paste). Re-add it with no surrounding whitespace."
              exit 1
            fi
          done

      # The GPU image is ~10GB; reclaim runner disk before building or the export
      # step dies with "no space left on device". Same action the release build uses.
      - uses: mathio/gha-cleanup@v1
        with:
          remove-browsers: true
          verbose: true

      - uses: actions/checkout@v5
      - uses: ./.github/workflows/composite-actions/setup-git
        with:
          safe-directory: ${{ runner.workspace }}
      - uses: ./.github/workflows/composite-actions/set-version

      - name: Resolve image tags
        id: tags
        shell: bash
        env:
          # workflow_dispatch sends a string; push sends nothing. Default to tagging latest.
          PUSH_LATEST: ${{ github.event_name != 'workflow_dispatch' || inputs.push_latest }}
          IMAGE: arthurplatform/genai-engine-shield-migration-gpu
        run: |
          set -euo pipefail
          # VERSION is set by composite-actions/set-version, which reads ./version verbatim and
          # appends -dev off main. Assert the tag really is that file's content: ./version is
          # owned by upstream ("Increment arthur-engine version" commits) and arrives through
          # every upstream sync, so a botched merge of it must fail the build rather than
          # publish an unversioned, stale, or empty tag.
          FILE_VERSION="$(tr -d '[:space:]' < version)"
          if [ -z "${FILE_VERSION}" ]; then
            echo "::error::./version is empty — refusing to publish an untagged image."
            exit 1
          fi
          case "${VERSION}" in
            "${FILE_VERSION}" | "${FILE_VERSION}-dev") ;;
            *)
              echo "::error::Tag mismatch: VERSION='${VERSION}' but ./version contains '${FILE_VERSION}'."
              exit 1
              ;;
          esac
          {
            echo "list<<EOF"
            echo "${IMAGE}:${VERSION}"
            if [ "${PUSH_LATEST}" = "true" ]; then echo "${IMAGE}:latest"; fi
            echo "EOF"
            echo "scan=${IMAGE}:${VERSION}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Publishing \`${IMAGE}\`"
            echo
            echo "| tag | source |"
            echo "| --- | --- |"
            echo "| \`${VERSION}\` | \`./version\` |"
            if [ "${PUSH_LATEST}" = "true" ]; then echo "| \`latest\` | moved to this build |"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Log in to Docker Hub
        id: dockerhub_login
        uses: docker/login-action@v3.6.0
        with:
          username: ${{ secrets.DOCKERHUB_OSS_USERNAME }}
          password: ${{ secrets.DOCKERHUB_OSS_TOKEN }}

      # Docker Hub answers every credential problem with the same opaque
      # "unauthorized: incorrect username or password". This turns that into the actual
      # candidate causes, ranked. The job still fails — this only annotates it.
      - name: Diagnose Docker Hub login failure
        if: failure() && steps.dockerhub_login.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "### Docker Hub rejected the credentials"
            echo
            echo "The secrets are present and whitespace-clean (the preflight passed), so the"
            echo "**values** are being refused. Ordered by what has actually happened here:"
            echo
            echo "1. \`DOCKERHUB_OSS_TOKEN\` is **expired, revoked, or belongs to a different"
            echo "   account** than the username. This was the cause of the 2026-07-28 outage"
            echo "   (run 30396576895) — replacing the token alone fixed it. Check this first."
            echo "2. An **account password** was used instead of a personal access token. Password"
            echo "   login fails outright when 2FA is enabled on the account."
            echo "3. \`DOCKERHUB_OSS_USERNAME\` is set to the **organization** name"
            echo "   (\`arthurplatform\`). An org is not a login identity — authenticate as a *user"
            echo "   account that is a member of* the org, whose token can push to"
            echo "   \`arthurplatform/genai-engine-shield-migration-gpu\`."
            echo "4. An **email address** was used instead of the Docker Hub username."
            echo
            echo "Verify the exact pair locally before re-running:"
            echo
            echo '```'
            echo 'echo "$TOKEN" | docker login -u "$USERNAME" --password-stdin'
            echo '```'
            echo
            echo "A read-only token is enough to *log in* but will fail later at push, so confirm"
            echo "the token has **Read & Write** scope."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Docker Hub rejected the credentials — see the job summary for the ranked causes."

      # GITLAB_UNIFY_FRONTEND_TOKEN is REQUIRED — the ui-build stage exits 1 without it
      # (private @arthur/* packages). The analytics/anti-abuse keys are optional; when
      # blank the corresponding UI feature simply stays disabled.
      # ENABLE_TELEMETRY stays false: this is a migration fork, not a released build.
      - name: Build and push GPU image
        uses: docker/build-push-action@v6.18.0
        with:
          context: "{{defaultContext}}:genai-engine"
          file: dockerfile
          build-args: |
            TORCH_DEVICE=gpu
            ENABLE_TELEMETRY=false
            GITLAB_UNIFY_FRONTEND_TOKEN=${{ secrets.GITLAB_UNIFY_FRONTEND_TOKEN }}
            AMPLITUDE_API_KEY=${{ secrets.AMPLITUDE_API_KEY }}
            VITE_AMPLITUDE_DEPLOYMENT_KEY=${{ secrets.AMPLITUDE_DEPLOYMENT_KEY }}
            VITE_AMPLITUDE_REPLAY_SAMPLE_RATE=${{ vars.AMPLITUDE_REPLAY_SAMPLE_RATE }}
            RECAPTCHA_ENTERPRISE_SITE_KEY=${{ secrets.RECAPTCHA_ENTERPRISE_SITE_KEY }}
          tags: ${{ steps.tags.outputs.list }}
          push: true
          platforms: linux/amd64
          # SBOM attestation only. Do NOT add `provenance: mode=max` — the build-args above
          # carry secrets and mode=max records build-arg values into the attestation on a
          # public image.
          sbom: true

      # Advisory only — a CVE must never block publishing the migration image.
      #
      # OSS (not ENTERPRISE) credentials: the image being scanned is the one this job just
      # pushed to the OSS `arthurplatform` namespace, so the account that pushed it is the
      # account that should pull it. Upstream's release workflow passes ENTERPRISE here, but
      # this fork has no DOCKERHUB_ENTERPRISE_* secrets, which left the pull anonymous and
      # rate-limited. Do not "restore" the upstream names when resolving a sync conflict.
      - name: Scan image & generate justification docs
        continue-on-error: true
        uses: ./.github/workflows/composite-actions/vuln-report
        with:
          image: ${{ steps.tags.outputs.scan }}
          slug: shield-migration-gpu
          dockerhub-username: ${{ secrets.DOCKERHUB_OSS_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_OSS_TOKEN }}
